<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Ankit Rauthan — Data Analyst</title>
  <desc id="desc">A burgundy-themed banner for a data analyst portfolio, with subtle animated light and data-inspired linework.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset=".52" stop-color="#190B12"/>
      <stop offset="1" stop-color="#451126"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C77B9B" stop-opacity="0"/>
      <stop offset=".5" stop-color="#E5B5C7" stop-opacity=".75"/>
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#E5B5C7" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="330" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="22" fill="url(#grid)"/>
  <circle cx="1030" cy="90" r="145" fill="#701A3D" opacity=".22"/>
  <circle cx="1030" cy="90" r="100" fill="none" stroke="#C77B9B" stroke-opacity=".35"/>
  <circle cx="1030" cy="90" r="65" fill="none" stroke="#E5B5C7" stroke-opacity=".2" stroke-dasharray="4 8">
    <animateTransform attributeName="transform" type="rotate" from="0 1030 90" to="360 1030 90" dur="45s" repeatCount="indefinite"/>
  </circle>
  <path d="M780 250 L850 210 L900 225 L965 155 L1010 175 L1070 115 L1135 130" fill="none" stroke="#C77B9B" stroke-width="2" stroke-opacity=".65"/>
  <path d="M780 250 L850 210 L900 225 L965 155 L1010 175 L1070 115 L1135 130" fill="none" stroke="url(#shine)" stroke-width="4" filter="url(#glow)">
    <animate attributeName="stroke-dasharray" values="0 600;180 420;0 600" dur="7s" repeatCount="indefinite"/>
  </path>
  <g fill="#E5B5C7">
    <circle cx="850" cy="210" r="4"/><circle cx="965" cy="155" r="4"/><circle cx="1070" cy="115" r="4"/>
  </g>
  <text x="74" y="112" fill="#C77B9B" font-family="Segoe UI, Arial, sans-serif" font-size="17" letter-spacing="5">DATA • INSIGHTS • IMPACT</text>
  <text x="70" y="174" fill="#F8F0F3" font-family="Segoe UI, Arial, sans-serif" font-size="49" font-weight="700">Ankit Rauthan</text>
  <text x="74" y="218" fill="#E5B5C7" font-family="Segoe UI, Arial, sans-serif" font-size="23">Aspiring Data Analyst</text>
  <text x="74" y="257" fill="#F8F0F3" fill-opacity=".82" font-family="Segoe UI, Arial, sans-serif" font-size="16">SQL  /  Advanced Excel  /  Power BI  /  Python</text>
  <rect x="74" y="282" width="250" height="3" rx="2" fill="#701A3D"/>
  <rect x="74" y="282" width="90" height="3" rx="2" fill="#E5B5C7">
    <animate attributeName="width" values="40;220;40" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
